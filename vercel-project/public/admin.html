<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访客统计后台 - 儿童智力测试</title>
<style>
:root {
  --primary: #FF9500;
  --bg: #F5F6FA;
  --card: #FFFFFF;
  --text: #333;
  --text2: #999;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 800px; margin: 0 auto; }

/* Header */
.header {
  text-align: center;
  padding: 40px 20px 30px;
}
.header h1 { font-size: 28px; color: var(--primary); }
.header p { color: var(--text2); margin-top: 8px; font-size: 14px; }

/* Stats Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  text-align: center;
}
.stat-card .value {
  font-size: 36px;
  font-weight: 700;
  color: var(--primary);
}
.stat-card .label {
  font-size: 13px;
  color: var(--text2);
  margin-top: 6px;
}

/* Chart area */
.chart-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}
.chart-card h3 {
  font-size: 16px;
  margin-bottom: 20px;
  color: var(--text);
}
.chart-row {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  height: 200px;
  padding-top: 10px;
  border-bottom: 1px solid #eee;
}
.chart-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
}
.chart-col .bar {
  width: 100%;
  max-width: 50px;
  border-radius: 8px 8px 0 0;
  transition: height 0.6s ease;
  position: relative;
  min-height: 4px;
}
.chart-col .bar .pv-num {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  font-weight: 600;
  color: var(--primary);
}
.chart-col .bar .uv-num {
  position: absolute;
  top: -40px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--text2);
}
.chart-col .date-label {
  font-size: 10px;
  color: var(--text2);
  margin-top: 8px;
  writing-mode: vertical-lr;
  letter-spacing: 1px;
}

/* Refresh bar */
.refresh-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
.refresh-bar .updated {
  font-size: 12px;
  color: var(--text2);
}
.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { opacity: 0.9; }
.btn-outline {
  background: #fff;
  color: var(--primary);
  border: 1px solid var(--primary);
}

/* Loading */
.loading {
  text-align: center;
  padding: 60px;
  color: var(--text2);
}
.spinner {
  display: inline-block;
  width: 32px;
  height: 32px;
  border: 3px solid #eee;
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Legend */
.legend {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-top: 16px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text2);
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
}

/* Link back */
.back-link {
  text-align: center;
  margin-top: 30px;
  padding-bottom: 30px;
}
.back-link a {
  color: var(--primary);
  text-decoration: none;
  font-size: 14px;
}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>📊 访客统计后台</h1>
    <p>儿童智力测试 · 实时数据</p>
  </div>

  <div class="refresh-bar">
    <span class="updated" id="updatedAt">加载中...</span>
    <button class="btn btn-primary" onclick="loadStats()">🔄 刷新数据</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="value" id="totalPV">-</div>
      <div class="label">📈 总访问量 (PV)</div>
    </div>
    <div class="stat-card">
      <div class="value" id="totalUV">-</div>
      <div class="label">👥 总独立访客 (UV)</div>
    </div>
    <div class="stat-card">
      <div class="value" id="todayPV">-</div>
      <div class="label">📅 今日访问</div>
    </div>
    <div class="stat-card">
      <div class="value" id="todayUV">-</div>
      <div class="label">👤 今日独立访客</div>
    </div>
    <div class="stat-card" style="background:linear-gradient(135deg,#FFF8E1,#FFFFFF);">
      <div class="value" id="todayRevenue" style="color:#E65100;">-</div>
      <div class="label">💰 今日收益（元）</div>
    </div>
    <div class="stat-card" style="background:linear-gradient(135deg,#E8F5E9,#FFFFFF);">
      <div class="value" id="totalRevenue" style="color:#2E7D32;">-</div>
      <div class="label">💎 累计收益（元）</div>
    </div>
    <div class="stat-card" style="background:linear-gradient(135deg,#E3F2FD,#FFFFFF);">
      <div class="value" id="totalPayments" style="color:#1565C0;">-</div>
      <div class="label">🙏 累计付费人次</div>
    </div>
  </div>

  <div class="chart-card">
    <h3>📊 最近7天访问趋势</h3>
    <div class="chart-row" id="chartRow">
      <div class="loading"><div class="spinner"></div><p style="margin-top:12px">加载中...</p></div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#FF9500"></div>PV（访问量）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FF6B35"></div>UV（独立访客）</div>
    </div>
  </div>

  <div class="back-link">
    <a href="/">← 返回测试首页</a>
  </div>

</div>

<script>
async function loadStats() {
  document.getElementById('updatedAt').textContent = '加载中...';
  try {
    const res = await fetch('/api/stats');
    const data = await res.json();

    document.getElementById('totalPV').textContent = data.total?.toLocaleString() || '0';
    document.getElementById('totalUV').textContent = data.totalUV?.toLocaleString() || '0';

    if (data.dailyPV && data.dailyPV.length > 0) {
      const today = data.dailyPV[data.dailyPV.length - 1];
      document.getElementById('todayPV').textContent = today.pv?.toLocaleString() || '0';
      document.getElementById('todayUV').textContent = today.uv?.toLocaleString() || '0';
    } else {
      document.getElementById('todayPV').textContent = '0';
      document.getElementById('todayUV').textContent = '0';
    }

    // Revenue stats
    document.getElementById('totalRevenue').textContent = '¥' + ((data.totalRevenue || 0)).toFixed(2);
    document.getElementById('todayRevenue').textContent = '¥' + ((data.todayRevenue || 0)).toFixed(2);
    document.getElementById('totalPayments').textContent = data.totalPayments?.toLocaleString() || '0';

    // Draw chart
    drawChart(data.dailyPV || []);

    const t = new Date(data.generatedAt);
    document.getElementById('updatedAt').textContent = '更新于 ' + t.toLocaleString('zh-CN');
  } catch (err) {
    document.getElementById('updatedAt').textContent = '加载失败: ' + err.message;
  }
}

function drawChart(dailyData) {
  const row = document.getElementById('chartRow');
  if (!dailyData.length) {
    row.innerHTML = '<div style="width:100%;text-align:center;color:#999;padding:60px 0">暂无数据</div>';
    return;
  }

  const maxPV = Math.max(...dailyData.map(d => d.pv), 1);
  row.innerHTML = dailyData.map(d => {
    const pvH = Math.max((d.pv / maxPV * 160), 4);
    const uvH = Math.max(((d.uv || 0) / maxPV * 160), 2);
    return '<div class="chart-col">'
      + '<div class="bar" style="height:' + pvH + 'px;background:linear-gradient(180deg,#FF9500,#FFB84D)">'
      + '<span class="pv-num">' + d.pv + '</span>'
      + '<span class="uv-num">UV' + (d.uv || 0) + '</span>'
      + '</div>'
      + '<div class="date-label">' + d.date.slice(5) + '</div>'
      + '</div>';
  }).join('');
}

// Auto-refresh every 30s
setInterval(loadStats, 30000);
loadStats();
</script>
</body>
</html>
